openapi: 3.1.0
info:
  title: WorkBuddy 本地 API 桥
  version: 1.14.0
  description: |
    把本机 WorkBuddy 桌面端已登录的模型能力，经本地回环桥暴露为
    OpenAI 兼容与 Anthropic 兼容两套接口。仅监听 127.0.0.1。

    机器可读描述由人工维护（`docs/openapi.yaml`），与实现同步更新；
    客户端行为的权威口径以 `docs/dsh-llm-adapter-contract.md` 与源码为准。
servers:
  - url: http://127.0.0.1:8790
    description: 本机回环（默认端口，可用 WORKBUDDY_PORT 覆盖）
security:
  - bearerAuth: []
  - apiKeyHeader: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: WORKBUDDY_LOCAL_TOKEN（管理面 / 默认钥匙），或 WORKBUDDY_CLIENT_KEYS 中登记的客户端 key（仅聊天 / 模型 / 用量读取；管理端点与视频接口只接受 local）
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: 同上（Anthropic 系客户端的惯例写法）；管理端点不接受 client key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items: { type: object }
        stream: { type: boolean, default: false }
        tools: { type: array, items: { type: object } }
        tool_choice: {}
        max_tokens: { type: integer }
        temperature: { type: number }
        top_p: { type: number }
        stop: {}
    AnthropicMessagesRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        system: {}
        messages:
          type: array
          items: { type: object }
        stream: { type: boolean, default: false }
        tools: { type: array, items: { type: object } }
        tool_choice: {}
        max_tokens: { type: integer }
        temperature: { type: number }
        top_p: { type: number }
        stop_sequences: { type: array, items: { type: string } }
    VideoRequest:
      type: object
      additionalProperties: false
      description: |
        Miora 视频生成请求。mode 可显式指定，也可按是否带 first_frame / references 自动推断。
        first_frame 支持绝对本地路径、miora fileKey、公网 https URL、base64 data URI；
        input_reference 是 first_frame 的 OpenAI 风格别名。

        **未知字段一律 400**（避免拼错的键被静默忽略后按文生视频计费）。
        别名：first_frame_path / firstFrame / input_reference → first_frame；
        last_frame_path / lastFrame → last_frame；reference_paths → references；
        seconds → duration；aspectRatio → aspect_ratio。同一字段给多次会 400。
      properties:
        mode: { type: string, enum: [text, frame, reference] }
        prompt:
          type: string
          maxLength: 8000
          description: 文生视频/参考图必填；首尾帧模式可选
        duration:
          type: integer
          minimum: 1
          description: 正整数秒。本次实测支持 4–15 秒；3 秒会被上游拒绝
        seconds: { type: integer, minimum: 1, description: duration 的别名；两者不一致会 400 }
        resolution:
          type: string
          description: 本次实测支持 768P / 2K（768p/2k 会归一成大写）；720p 会被上游拒绝
        aspect_ratio:
          type: string
          pattern: '^[1-9][0-9]?:[1-9][0-9]?$'
          description: 正整数比；空格会被去掉。aspectRatio 是别名
        first_frame: { type: string }
        first_frame_path: { type: string, description: first_frame 的别名 }
        input_reference: { type: string, description: first_frame 的 OpenAI 风格别名 }
        last_frame: { type: string }
        last_frame_path: { type: string, description: last_frame 的别名 }
        references:
          type: array
          items: { type: string }
          description: 参考图；每项必须是非空字符串
        reference_paths: { type: array, items: { type: string }, description: references 的别名 }
        model: { type: string, description: 接受但忽略（选模型由 Miora 决定） }
    ImageRequest:
      type: object
      additionalProperties: false
      description: |
        Miora 图片生成请求。`POST /v1/images` 固定文生图（`mode=generate`），
        `POST /v1/images/edits` 固定图生图（`mode=edit`）；body 里显式 `mode` 会覆盖路径默认值。

        **未知字段一律 400**。`images` 每项支持绝对本地路径、miora fileKey、
        公网 https URL、base64 data URI，单张 ≤ 20 MB。
      properties:
        mode: { type: string, enum: [generate, edit] }
        prompt: { type: string, minLength: 1, maxLength: 8000 }
        size:
          type: string
          pattern: '^[0-9]{2,5}x[0-9]{2,5}$'
          description: 'WIDTHxHEIGHT，如 1024x1024；不传用模型默认'
        quality: { type: string, maxLength: 32, description: '文生图质量档（如 standard / hd）；图生图忽略' }
        images:
          type: array
          items: { type: string }
          description: 图生图的参考图（至少一张）
        image: { type: string, description: images 的单张别名，二者不能同时给 }
    Image:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: image }
        status: { type: string, enum: [queued, in_progress, completed, failed, cancelled] }
        upstream_status: { type: string }
        created_at: { type: [integer, 'null'], description: 提交时间（秒），best-effort 回填 }
        model: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        mode: { type: [string, 'null'], enum: [generate, edit, null] }
        size: { type: [string, 'null'] }
        quality: { type: [string, 'null'] }
        result_files:
          type: array
          description: 上游原始产物字段（通常含 signedUrl / mimeType / fileKey）
          items: { type: object, additionalProperties: true }
        output:
          type: [object, 'null']
          properties:
            url: { type: string }
            urls: { type: array, items: { type: string } }
        error:
          type: [object, 'null']
          properties:
            message: { type: string }
    Video:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: video }
        status: { type: string, enum: [queued, in_progress, completed, failed, cancelled] }
        upstream_status: { type: string }
        created_at:
          type: [integer, 'null']
          description: |
            提交时间（秒）。best-effort：同一个桥进程内查询会回填；
            桥重启或任务不是本进程提交的 → null（桥不伪造时间）
        model: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        mode:
          type: [string, 'null']
          description: 提交元数据，best-effort 回填（不写盘，桥重启后为 null）
        seconds: { type: [number, 'null'] }
        resolution: { type: [string, 'null'] }
        aspect_ratio: { type: [string, 'null'] }
        result_files:
          type: array
          description: 上游原始产物字段（通常含 signedUrl / mimeType / fileKey）
          items: { type: object, additionalProperties: true }
        output:
          type: [object, 'null']
          properties:
            url: { type: string }
            urls: { type: array, items: { type: string } }
        error:
          type: [object, 'null']
          properties:
            message: { type: string }
paths:
  /v1/chat/completions:
    post:
      summary: OpenAI 兼容对话（支持流式、工具调用、多模态）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: 非流式返回聚合结果；stream=true 时返回 text/event-stream
        '413': { description: 请求体超限 }
        '429': { description: 本地限流（需 opt-in），带 Retry-After }
        '502': { description: 上游错误（透传状态码） }
  /v1/web_search:
    post:
      summary: WorkBuddy 原生网页搜索（不经过 DeepSeek）
      description: 直连 WorkBuddy `/agenttool/v1/search`；dsh 的 Web search provider 可把接口地址指到本桥后使用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 4000 }
                max_results: { type: integer, minimum: 1, maximum: 10, default: 5 }
                allowed_domains: { type: array, items: { type: string } }
                freshness: { type: string, description: 'd/d1..d30, m/m1..m12, y/y1..y5' }
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  query: { type: string }
                  provider: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        url: { type: string }
                        snippet: { type: string }
                        site: { type: string }
                        favicon: { type: string }
                        publishedAt: { type: string }
                  total_results: { type: integer }
                  response_time_ms: { type: integer }
                  truncated: { type: boolean }
        '400': { description: 参数错误 }
        '429': { description: WorkBuddy 搜索限流（code 15001），带 Retry-After }
        '502': { description: 上游/登录态错误 }
        '504': { description: 搜索超时 }
  /v1/videos:
    post:
      summary: 提交 Miora 视频生成（文生视频 / 首尾帧 / 参考图）
      description: |
        异步任务：成功返回 202，之后用 GET /v1/videos/{id} 查询。
        提交成功即按 WorkBuddy 账号积分计费；401 只会换临时 key 重试一次，
        429/5xx 不自动重试，避免重复计费。只接受本地管理令牌（local token）。详见 docs/VIDEO-GENERATION.md。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoRequest' }
      responses:
        '202':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
        '400': { description: 参数错误（含未知字段；不会提交上游） }
        '401': { description: 登录态不可用，或临时 key 申请失败 }
        '403': { description: 只接受本地管理令牌；client key 返回 VIDEO_LOCAL_TOKEN_REQUIRED }
        '429': { description: Miora 限流，带 Retry-After }
        '502': { description: Miora 不可用 / 上游拒绝 }
  /v1/videos/{video_id}:
    get:
      summary: 查询视频任务状态（可长轮询）
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string }
        - name: wait
          in: query
          required: false
          description: |
            让桥代客户端轮询的秒数（0–60，整数）。每 2 秒查一次，直到终态或预算用完；
            超时返回最后一次状态（不是失败）。查询不计费，可重复。
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        '200':
          description: 当前任务状态（pending 归一到 queued，processing 归一到 in_progress）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
        '400': { description: video_id 或 wait 非法 }
        '401': { description: 登录态不可用 }
        '403': { description: client key 不可用（仅 local token） }
        '404': { description: 上游没有该任务 }
        '502': { description: Miora 不可用 }
  /v1/videos/{video_id}/content:
    get:
      summary: 跳转到已完成视频的签名 URL
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string }
        - name: wait
          in: query
          required: false
          description: 先等待任务出片再跳转（0–60 秒）
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        '302': { description: Location 指向上游 https 签名 URL（有时效） }
        '403': { description: client key 不可用（仅 local token） }
        '404': { description: 上游没有该任务 }
        '409': { description: 任务未完成（VIDEO_NOT_READY） }
        '502': { description: 已完成但上游没有 https 产物（VIDEO_NO_OUTPUT），或 Miora 不可用 }
  /v1/images:
    post:
      summary: 提交 Miora 文生图任务
      description: |
        异步任务：成功返回 202，之后用 GET /v1/images/{id} 查询。
        提交成功即按 WorkBuddy 账号积分计费；401 只换临时 key 重试一次，
        429/5xx 不自动重试。只接受本地管理令牌（local token）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageRequest' }
      responses:
        '202':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '400': { description: 参数错误（含未知字段与带 images 的冲突；不会提交上游） }
        '401': { description: 登录态不可用，或临时 key 申请失败 }
        '403': { description: 只接受本地管理令牌；client key 返回 IMAGE_LOCAL_TOKEN_REQUIRED }
        '429': { description: Miora 限流，带 Retry-After }
        '502': { description: Miora 不可用 / 上游拒绝 }
  /v1/images/edits:
    post:
      summary: 提交 Miora 图生图任务
      description: |
        与 POST /v1/images 同构，但默认 mode=edit，必须提供 images[]（至少一张）。
        计费、重试与鉴权规则同上。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageRequest' }
      responses:
        '202':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '400': { description: 参数错误（缺 images / 未知字段等） }
        '401': { description: 登录态不可用 }
        '403': { description: 仅 local token }
        '429': { description: Miora 限流 }
        '502': { description: Miora 不可用 / 上游拒绝 }
  /v1/images/{image_id}:
    get:
      summary: 查询图片任务状态（可长轮询）
      parameters:
        - name: image_id
          in: path
          required: true
          schema: { type: string }
        - name: wait
          in: query
          required: false
          description: 让桥代轮询的秒数（0–60，整数）；超时返回最后一次状态，不是失败
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        '200':
          description: 当前任务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '400': { description: image_id 或 wait 非法 }
        '401': { description: 登录态不可用 }
        '403': { description: client key 不可用（仅 local token） }
        '404': { description: 上游没有该任务（IMAGE_NOT_FOUND） }
        '502': { description: Miora 不可用 }
  /v1/images/{image_id}/content:
    get:
      summary: 跳转到已完成图片的签名 URL
      parameters:
        - name: image_id
          in: path
          required: true
          schema: { type: string }
        - name: wait
          in: query
          required: false
          description: 先等待任务出图再跳转（0–60 秒）
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        '302': { description: Location 指向上游 https 签名 URL（有时效） }
        '403': { description: client key 不可用（仅 local token） }
        '404': { description: 上游没有该任务 }
        '409': { description: 任务未完成（IMAGE_NOT_READY） }
        '502': { description: 已完成但无 https 产物（IMAGE_NO_OUTPUT），或 Miora 不可用 }
  /v1/messages:
    post:
      summary: Anthropic Messages 兼容（Claude Code 直连）
      description: system 顶层字段、tool_use / tool_result 块数组均按 Anthropic 规范翻译；上游拉黑 Claude Code 固定 system 模板的问题已在出站层最小改写。当 `tools` 含 `web_search_20250305` 时，桥改为调用 WorkBuddy 原生搜索，返回非流式 Anthropic 消息（`server_tool_use` + `web_search_tool_result` + 可选 text citations），不转发 DeepSeek；`stream:true` 会得到明确 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200': { description: 非流式返回 Anthropic Message；stream=true 返回 SSE 事件序列 }
        '400': { description: 上游拒绝（含审计模板类，见 TROUBLESHOOTING） }
        '413': { description: 请求体超限 }
  /v1/messages/count_tokens:
    post:
      summary: 估算输入 token（Anthropic 规范同形）
      description: 纯本地估算，不打上游、不记账。区分 ASCII（约 4 字符/token）与非 ASCII（CJK 约按字计）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: 估算结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  input_tokens: { type: integer }
  /v1/models:
    get:
      summary: 模型目录（双端点合并）
      parameters:
        - in: query
          name: all
          schema: { type: string }
          description: all=1 返回完整目录并刷新缓存
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
  /v1/identity:
    get:
      summary: 极轻身份快照（只解析凭据，不抓目录、不打上游）
      description: 面板每 2 秒轮询；`auth.changedAt` / `pid` / `build` 变化即代表账号或桥进程换代，前端应立刻重拉账号、积分与模型目录。
      responses:
        '200': { description: 当前来源、账号、desktopUserId、构建指纹与 changedAt }
        '503': { description: 凭据读不出来（带错误原因与 pid/build） }
  /v1/quota:
    get:
      summary: 积分余额（带缓存，TTL 由 WORKBUDDY_QUOTA_TTL_MS 控制）
      responses:
        '200': { description: 余额与套餐；`account` / `source` 标明这份余额属于哪个账号 }
  /v1/usage:
    get:
      summary: 本地用量聚合（按天 / 按模型）
      parameters:
        - in: query
          name: days
          schema: { type: integer }
      responses:
        '200':
          description: 用量统计（来自本地账本）。`calls` / `promptTokens` / `completionTokens` / `credit` 只统计模型调用；网页搜索与接入自检单列为 `searches` / `searchFailed`，不计入模型 tokens 或积分。
    delete:
      summary: 清空账本
      responses:
        '200': { description: 已清空 }
  /v1/requests:
    get:
      summary: 最近请求明细 + 进行中的请求
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: 明细（requests[]，只含元数据）与进行中（active[]，含 runningMs）及 activeAlertMs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  requests:
                    type: array
                    items: { type: object }
                  active:
                    type: array
                    items: { type: object }
                  activeAlertMs: { type: number }
  /v1/checkin:
    get:
      summary: 查询签到状态
      responses:
        '200': { description: 状态 }
    post:
      summary: 执行每日签到
      responses:
        '200': { description: 签到结果与状态 }
  /v1/embeddings:
    post:
      summary: 明确 501 —— 上游没有任何 embedding 模型
      description: 桥不做"假的向量"。需要 RAG 的客户端请另配 embedding 提供方。
      responses:
        '501': { description: not implemented（有意的） }
  /health:
    get:
      summary: 只读健康检查（毫秒级，绝不等待上游）
      security: []
      responses:
        '200':
          description: ok=true，带 auth / clientExe / process / clients 等
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pid: { type: integer }
                  clientExe: { type: string }
                  process:
                    type: object
                    properties:
                      requests: { type: integer }
                      errors: { type: integer }
                      byStatus: { type: object }
                      rateLimited: { type: integer }
                  clients:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      count: { type: integer }
        '503': { description: 凭据读不出来（body 带原因；插件据此判 degraded） }
  /:
    get:
      summary: 服务自述（端点清单与精选模型）
      security: []
      responses:
        '200': { description: 说明文本 }
