# 发版前检查：vendor 与仓库同步 + 静态检查 + 单测 + 桥合约 + 独立分发包演练
#
# 为什么放在 CI：这个插件的"发布物"是自带桥与控制台的 vendor/ 快照，
# 只要忘了重跑 vendor，别人装到的就是旧代码 —— 这类问题本地很容易漏。
name: release-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 凭据解密的密钥来自 WorkBuddy 客户端自己的 Electron 原生绑定（**不是 DPAPI**，
    # 包里不含任何密钥）；这条路只有 Windows 上实测过。测试本身跨平台，
    # 但独立演练会真的起桥，所以主门禁固定 Windows 更贴近真实使用环境。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: vendor 与仓库是否同步
        run: node dsh-plugin/scripts/vendor.mjs --check

      - name: 安装 devDependencies（check:types / lint 需要）
        run: npm ci

      - name: 类型检查（tsc --checkJs）
        run: npm run check:types

      - name: ESLint
        run: npm run lint

      - name: 单元测试（协议 / 装配 / 路由矩阵 / 分发形态）
        run: npm run test:plugin

      - name: lib 单测（凭据信封 / 配置解析 / 探测 / 状态）
        run: npm run test:lib

      - name: 桥测试（合约 + 启动参数）
        run: npm run test:bridge

      # 1.13.0 的 npm 包曾漏掉 bridge/miora-video.mjs —— check:pack 专防这类漏打包。
      - name: npm 包文件清单（防漏打包）
        run: npm run check:pack

      # 面板 i18n 要真实浏览器（findChrome 会找本机 Chrome/Edge）。
      # 只在 Windows 主门禁跑：这是实际使用环境，也避免给跨平台矩阵加浏览器依赖。
      - name: 面板 i18n 验收（真实浏览器）
        run: npm run panel:i18n

      - name: 面板渲染验收（真实浏览器）
        run: npm run panel:render

      # Windows 中文/空格路径是现场高频故障（安装路径、TEMP、账号目录）。
      # 让独立分发包演练在含中文与空格的 TEMP 下再跑一次。
      - name: Windows 中文/空格路径独立演练
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP '工作 buddy 验证'
          New-Item -ItemType Directory -Force $root | Out-Null
          $env:TEMP = $root
          $env:TMP = $root
          node dsh-plugin/scripts/verify-standalone.mjs

      - name: 独立分发包演练（没有仓库时也能跑起来）
        run: node dsh-plugin/scripts/verify-standalone.mjs

      - name: GitHub 直装形态演练（根包 pack + 安装 + 客户端 id 契约）
        run: npm run verify:github

  cross-platform:
    # B4：README 承认 macOS/Linux「已实现未实测」—— 矩阵 CI 是唯一低成本的
    # 兑现方式。跑除 verify-standalone 之外的跨平台子集（独立演练的跨平台
    # 版本由这个矩阵逐步暴露问题，别一次全上）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: vendor 与仓库是否同步
        run: node dsh-plugin/scripts/vendor.mjs --check

      - name: 安装 devDependencies（check:types / lint 需要）
        run: npm ci

      - name: 类型检查
        run: npm run check:types

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm run test:plugin

      - name: lib 单测
        run: npm run test:lib

      - name: 桥测试（假凭据，不触真上游）
        run: npm run test:bridge

  docker-build:
    # Dockerfile 是 API-key 网关形态；这里只做构建门禁，避免再次出现
    # “文档说支持、实际构建就坏”的纸面能力。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t workbuddy-bridge:ci .
