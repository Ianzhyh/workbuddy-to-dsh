# ============================================================================
# workbuddy-to-dsh —— bundle patch（仓库根 / github 直装形态用）
#
# 与 dsh-plugin/cordis.patch.yml 内容除 name 外完全一致 —— 改动时同步两份。
# 为什么需要两份：dsh 对 Loader 行里 unknown name 的处理是静默跳过而不是报错，
# 所以 patch 里的 name 必须与"实际安装的那个包"的包名一致：
#   - 本文件（仓库根）：github 直装时 npm 装的就是根包，包名 = workbuddy-to-dsh；
#   - dsh-plugin/cordis.patch.yml：单文件夹分发时包名 = dsh-plugin-workbuddy。
#
# 只做一件事：把本插件自己的 Loader 条目插进配置树。id 是「条目 id」，
# 用户可用同一个 id 在自己的 $DSH_HOME/profiles/<profile>/cordis.patch.yml
# 里覆盖 config（例如 projectRoot 指向检出目录）。
#
# 这里**不动**任何官方条目：模型路由由插件的宿主端在运行时
# 用 ctx.llm.registerAdapter() 注册，不写 settings.yaml，也不需要
# 给 llm-pi-ai 那一行打补丁。
# ============================================================================

- insert:
    - id: workbuddy
      name: workbuddy-to-dsh
